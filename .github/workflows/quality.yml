name: quality

# Same checks as locally: everything goes through ci/check (pinned containers).
# Runs on pull requests (every push to a PR branch, through the PR) and on
# main once merged. A push to a branch without a PR runs nothing: run
# ci/check and ci/macos-tests locally there.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same PR cancels the run still going. On main, every
# merge is checked to the end: a later merge never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ci/check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./ci/check

  # The target platform: macOS tools (BSD sed/find/date, mdls, caffeinate,
  # xcodebuild) and macOS's own /bin/bash 3.2, which the Linux container
  # can't cover.
  macos-bash32:
    name: tests on macOS, /bin/bash 3.2
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/macos-tests
