minVersion = "v8.25.0"

# Default Gitleaks rules. The local files (session logs, quarantine) are
# scanned too: a token printed by brew or port must be caught there
# before it could be copied anywhere. ci/check also opens archives
# (--max-archive-depth), so the build log archives in logs/ are read.
# Only .git/ is skipped, plus one narrow false positive (last entry).
[extend]
useDefault = true

[[allowlists]]
description = "git internals"
paths = [
    '''(^|/)\.git(/|$)''',
]

# Compiler command lines in archived build logs (logs/*_buildlogs.tar.gz,
# scanned with --max-archive-depth): -DG_LOG_DOMAIN="<module name>" is a
# GLib log domain, not a key. Only on those lines, only under logs/.
[[allowlists]]
description = "GLib log domains in archived build logs"
condition = "AND"
regexTarget = "line"
paths = [
    '''^logs/''',
]
regexes = [
    '''-DG_LOG_DOMAIN=\\?"[A-Za-z0-9._-]+\\?"''',
]
